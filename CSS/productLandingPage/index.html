<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Landing Page</title>

  <style>
  
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    
    #header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #ffffff;
      border-bottom: 2px solid #ddd;
      display: flex;              
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 1000;
    }

    #header-img {
      width: 120px;
    }

    #nav-bar {
      display: flex;              
      gap: 20px;
    }

    .nav-link {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    .nav-link:hover {
      color: #0077b6;
    }

    
    main {
      margin-top: 100px;
      padding: 20px;
    }

    section {
      margin-bottom: 60px;
    }

   
    #video {
      max-width: 100%;
      display: block;
      margin: auto;
    }

   
    #form {
      display: flex;              
      flex-direction: column;
      max-width: 400px;
      margin: auto;
      gap: 10px;
    }

    #email {
      padding: 10px;
      font-size: 1rem;
    }

    #submit {
      padding: 10px;
      font-size: 1rem;
      background-color: #0077b6;
      color: white;
      border: none;
      cursor: pointer;
    }

    #submit:hover {
      background-color: #023e8a;
    }

    
    @media (max-width: 768px) {
      #header {
        flex-direction: column;
        align-items: center;
      }

      #nav-bar {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>


  <header id="header">
    <img
      id="header-img"
      src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2015.png"
      alt="Product Logo"
    />

    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#video-section">Demo</a>
      <a class="nav-link" href="#pricing">Pricing</a>
    </nav>
  </header>

 
  <main>

    <section id="features">
      <h2>Features</h2>
      <p>Our product is designed to improve productivity and simplicity.</p>
      <p>It works seamlessly across all platforms.</p>
    </section>

    <section id="video-section">
      <h2>Product Demo</h2>
      <iframe
        id="video"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </section>

    <section id="pricing">
      <h2>Pricing</h2>
      <p>Affordable plans for everyone.</p>
    </section>

    <section id="signup">
      <h2>Stay Updated</h2>

      <form
        id="form"
        action="https://www.freecodecamp.org/email-submit"
      >
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email address"
          required
        />

        <input
          id="submit"
          type="submit"
          value="Get Started"
        />
      </form>
    </section>

  </main>

</body>
</html>
